name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ComfyUI ${{ matrix.comfy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        comfy: ['v0.42.4']
        include:
          - python: '3.12'
            comfy: master
    env:
      COMFYUI_ROOT: ${{ github.workspace }}/.comfy
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy }}
          path: .comfy
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            .comfy/requirements.txt
      - name: Install CI CPU runtime (ComfyUI owns Torch)
        run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install ComfyUI, pack and test dependencies
        run: python -m pip install -r .comfy/requirements.txt -r requirements.txt -r requirements-dev.txt
      - name: Import and route startup smoke
        run: python scripts/smoke_import.py
      - name: Python and real ComfyUI decoder integration tests
        run: python scripts/run_tests.py -q
      - name: Build distribution
        run: python -m build
      - name: Verify runtime assets and third-party notices
        run: python scripts/check_distribution.py

  browser:
    name: JavaScript and Chromium regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify default node screenshots
        run: python scripts/check_node_screenshots.py
      - run: python -m pip install -r requirements-core.txt -r requirements-media.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
